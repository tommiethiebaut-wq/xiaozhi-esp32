
name: Build Custom ESP32-S3 N16R8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-S3 N16R8 Custom
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build custom board
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py esp32-s3-n16r8-custom --name esp32-s3-n16r8-custom

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi-esp32-s3-n16r8-custom
          path: build/merged-binary.bin
          if-no-files-found: error
